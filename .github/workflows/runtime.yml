name: Publish WeChat runtime
on:
  push:
    tags: ['runtime-v*']
permissions:
  contents: write
jobs:
  runtime:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - run: node runtime/build.mjs
      - name: Verify fresh installation
        run: node --test runtime/install.test.mjs
        env:
          WORKA_WECHAT_TEST_ASSET: artifacts/runtime
      - name: Publish fixed runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/runtime/worka-wechat-runtime-*-darwin-arm64.tar.gz
          artifacts/runtime/release.json
          --verify-tag --title "WeChat runtime $GITHUB_REF_NAME"
          --notes "Portable macOS arm64 runtime. Agent installs the verified bundle; native macOS authorization and WeChat login remain interactive."
